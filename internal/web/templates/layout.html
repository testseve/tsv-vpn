<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.Title}} - tsv-vpn</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/htmx.min.js" defer></script>
</head>
<body class="min-h-screen">
{{if .Authenticated}}
<header class="border-b border-zinc-800">
    <nav class="mx-auto flex max-w-5xl flex-wrap items-center gap-x-6 gap-y-2 px-4 py-4 sm:px-6">
        <a href="/" class="flex items-center gap-2 font-semibold text-zinc-100 hover:text-zinc-100">
            <span class="block h-6 w-6">{{template "logo"}}</span>
            tsv-vpn
        </a>
        <a href="/" class="text-sm transition-colors {{if eq .Active "dashboard"}}text-sky-500{{else}}text-zinc-400 hover:text-zinc-100{{end}}">Connections</a>
        <a href="/subnets" class="text-sm transition-colors {{if eq .Active "subnets"}}text-sky-500{{else}}text-zinc-400 hover:text-zinc-100{{end}}">Subnets</a>
        <a href="/tailnet" class="text-sm transition-colors {{if eq .Active "tailnet"}}text-sky-500{{else}}text-zinc-400 hover:text-zinc-100{{end}}">Tailnet</a>
        <a href="/password" class="ml-auto text-sm transition-colors {{if eq .Active "password"}}text-sky-500{{else}}text-zinc-400 hover:text-zinc-100{{end}}">Password</a>
        <form method="post" action="/logout">
            <button class="text-sm text-zinc-400 transition-colors hover:text-zinc-100">Log out</button>
        </form>
    </nav>
</header>
{{end}}
<main class="mx-auto max-w-5xl px-4 py-8 sm:px-6 page-enter">
    {{template "content" .}}
</main>
{{if .Authenticated}}
<footer class="mx-auto max-w-5xl px-4 pb-8 sm:px-6">
    <a href="/releases" class="text-xs text-zinc-500 transition-colors hover:text-zinc-300">tsv-vpn {{.Version}} · release notes</a>
</footer>
{{end}}
</body>
</html>
