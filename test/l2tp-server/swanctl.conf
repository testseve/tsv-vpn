connections {
    l2tp {
        version = 1
        local_addrs = %any
        remote_addrs = %any
        encap = yes
        keyingtries = 0
        rekey_time = 0
        proposals = aes256-sha256-modp2048,aes128-sha1-modp1024,default

        local {
            auth = psk
        }
        remote {
            auth = psk
        }

        children {
            l2tp {
                mode = transport
                local_ts = dynamic[udp/l2tp]
                remote_ts = dynamic[udp]
                esp_proposals = aes256-sha256,aes128-sha1,default
                dpd_action = clear
            }
        }
    }
}

secrets {
    ike-l2tp {
        id = %any
        secret = "test-preshared-key"
    }
}
