charon {
    # Transport-mode SAs need no routes of their own; this app installs the
    # per-tunnel ppp routes itself and must stay the only writer of the table.
    install_routes = no

    filelog {
        stderr {
            default = 1
            ike = 2
            time_format = %b %e %T
        }
    }
}

swanctl {
    load = pem pkcs1 pkcs8 x509 revocation constraints pubkey sha1 sha2 md5 random
}
